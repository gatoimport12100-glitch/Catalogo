<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GATO IMPORT - Catálogo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👠</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

    :root {
      --fondo-pagina: #f8f9fa; --fondo-tarjeta: #ffffff;
      --texto-primario: #1e293b; --texto-secundario: #64748b;
      --borde-logo-fondo: rgba(255,255,255,0.2);
      --borde-item: #e2e8f0; --borde-item-hover: #0066ff;
      --fondo-item-hover: #e6f0ff; --color-primario: #0066ff;
      --rojo: #dc2626; --verde: #16a34a;
      --sombra-suave: 0 2px 8px rgba(0,0,0,0.06);
      --tamano-logo: 85px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fondo-pagina: #0f172a; --fondo-tarjeta: #1e293b;
        --texto-primario: #f1f5f9; --texto-secundario: #94a3b8;
        --borde-item: #334155; --borde-item-hover: #0066ff;
        --fondo-item-hover: #1e293b;
        --sombra-suave: 0 2px 8px rgba(0,0,0,0.2);
      }
    }

    html, body {
      background: var(--fondo-pagina);
      max-width: 800px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ===== ENCABEZADO — BARRA DE TÍTULO ===== */
    .encabezado-tienda {
      background: var(--color-primario);
      color: white;
      padding: 4px 10px;
      border-radius: 10px;
      margin: 5px;
      margin-bottom: 0; /* ✅ SIN MARGEN ABAJO — pegado al buscador */
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      position: relative;
      z-index: 2;
      box-shadow: 0 2px 4px rgba(0,102,255,0.2);
    }

    /* ===== CÍRCULO IZQUIERDO — ALINEADO ARRIBA CON LA BARRA ===== */
    .circulo-rotativo {
      width: var(--tamano-logo);
      height: var(--tamano-logo);
      border-radius: 50%;
      border: 3px solid var(--color-primario); /* ✅ MISMO COLOR QUE LA BARRA */
      background: var(--borde-logo-fondo);
      position: absolute;
      left: 6px;
      top: 0; /* ✅ BORDE SUPERIOR = BORDE SUPERIOR DE LA BARRA */
      transform: translateY(0);
      overflow: hidden;
      z-index: 3;
    }
    .circulo-rotativo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease;
    }

    /* ===== TÍTULO ===== */
    .titulo-tienda {
      position: absolute;
      left: calc(var(--tamano-logo) + 12px);
      right: calc(var(--tamano-logo) + 12px);
      text-align: center;
      top: 50%;
      transform: translateY(-50%);
    }
    .titulo-principal { font-size: 18px; font-weight: bold; line-height: 1.2; }
    .titulo-secundario { font-size: 11px; opacity: 0.9; line-height: 1.2; margin-top: 1px; }

    /* ===== LOGO DERECHO — ALINEADO ARRIBA ===== */
    .logo-principal {
      width: var(--tamano-logo);
      height: var(--tamano-logo);
      border-radius: 50%;
      border: 3px solid var(--color-primario); /* ✅ MISMO COLOR DE BORDE */
      background: var(--borde-logo-fondo);
      position: absolute;
      right: 6px;
      top: 0; /* ✅ MISMO NIVEL SUPERIOR QUE LA BARRA */
      transform: translateY(0);
      overflow: hidden;
      z-index: 3;
    }
    .logo-principal img { width: 100%; height: 100%; object-fit: cover; }

    #pantallaLista { display: block; }
    #pantallaDetalle { display: none; }
    #pantallaMapa { display: none; }

    /* ===== BUSCADOR — PEGADO JUSTO DESPUÉS DE LA BARRA ===== */
    .buscador {
      width: 55%;
      max-width: 300px;
      padding: 5px 10px;
      margin: 8px auto 6px; /* ✅ MUY POCO ESPACIO ARRIBA — pegado arriba */
      border: 2px solid var(--borde-item);
      border-radius: 10px;
      font-size: 13px;
      background: var(--fondo-tarjeta);
      color: var(--texto-primario);
      outline: none;
      display: block;
      position: relative;
      z-index: 1;
      transition: border-color 0.2s ease;
    }
    .buscador:focus {
      border-color: #0066ff;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,102,255,0.15);
    }

    .contador-general { 
      font-size: 13px; color: #0066ff; font-weight: 600; 
      margin: 0 10px 6px; text-align: center;
    }
    .cargando { text-align: center; padding: 40px 20px; color: var(--texto-secundario); font-size: 16px; }
    .error-csv {
      color: var(--rojo); text-align: center; padding: 25px; margin: 10px;
      background: rgba(220,38,38,0.1); border-radius: 12px; line-height: 1.6;
    }
    .info-url { font-size: 12px; margin-top: 10px; opacity: 0.8; word-break: break-all; }

    .contenedor-lista { padding: 0 5px; }
    .grid-productos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding-bottom: 20px;
    }
    .item-producto {
      background: var(--fondo-tarjeta);
      border-radius: 14px;
      border: 1px solid var(--borde-item);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: var(--sombra-suave);
    }
    .item-producto:hover {
      transform: translateY(-3px);
      border-color: #0066ff;
      box-shadow: 0 4px 12px rgba(0,102,255,0.15);
    }
    .item-foto {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #f0f0f0;
    }
    .item-info { padding: 10px; }
    .item-codigo {
      font-size: 13px;
      font-weight: 600;
      color: var(--texto-primario);
      margin-bottom: 6px;
    }
    .item-precio {
      font-size: 17px;
      font-weight: bold;
      color: var(--verde);
    }

    /* ===== SEGUNDA PANTALLA ===== */
    #pantallaDetalle {
      display: none; flex-direction: column; min-height: 100vh;
    }
    .detalle-card {
      background: var(--fondo-tarjeta); border-radius: 16px; padding: 8px; margin: 5px;
      border-left: 5px solid #0066ff;
      display: flex; flex-direction: column;
      min-height: 100vh;
    }
    .contenedor-foto {
      position: relative;
      height: 34vh;
      min-height: 180px;
      max-height: 400px;
      margin-bottom: 6px; border-radius: 14px; overflow: hidden;
      background: var(--fondo-pagina); width: 100%;
      flex-shrink: 0;
    }
    .foto-principal { width: 100%; height: 100%; object-fit: contain; }
    .btn-flecha {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff; border: none;
      font-size: 20px; cursor: pointer; z-index: 2;
    }
    .btn-flecha.izquierda { left: 6px; }
    .btn-flecha.derecha { right: 6px; }
    .galeria-miniaturas {
      display: flex; gap: 5px; overflow-x: auto;
      margin-bottom: 5px;
      padding-bottom: 2px; flex-shrink: 0;
    }
    .miniatura {
      width: 55px; height: 55px;
      border-radius: 8px; object-fit: cover;
      cursor: pointer; border: 3px solid transparent; flex-shrink: 0;
    }
    .miniatura.activa { border-color: #0066ff; }
    .detalle-precio {
      font-size: 24px; font-weight: bold; color: var(--verde);
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .detalle-descripcion {
      font-size: 14px; color: var(--texto-secundario); line-height: 1.4;
      min-height: auto;
      max-height: 180px;
      overflow-y: auto;
      padding: 6px 8px;
      background: var(--fondo-pagina); border-radius: 8px;
      border-left: 4px solid #0066ff;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .contenedor-botones {
      display: flex; gap: 8px; width: 100%;
      margin-top: auto;
      padding-top: 6px;
      flex-shrink: 0;
    }
    .btn {
      flex: 1; padding: 10px 4px;
      border-radius: 50px; border: none;
      font-weight: bold; font-size: 13px; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 3px; color: #fff;
      white-space: nowrap;
    }
    .btn-regresar { background: var(--rojo); }
    .btn-whatsapp { background: #25D366; }
    .btn-ubicacion { background: #0066ff; }
    .logo-whatsapp { width: 18px; height: 18px; flex-shrink: 0; }

    /* ===== TERCERA PANTALLA ===== */
    #pantallaMapa {
      display: none; flex-direction: column; min-height: 100vh;
    }
    .mapa-card {
      background: var(--fondo-tarjeta); border-radius: 16px; padding: 10px; margin: 5px;
      border-left: 5px solid #0066ff;
      display: flex; flex-direction: column;
      min-height: 100vh;
    }
    .mapa-titulo {
      font-size: 18px; font-weight: bold; color: var(--texto-primario);
      text-align: center; margin-bottom: 6px; flex-shrink: 0;
    }
    .mapa-direccion {
      font-size: 14px; color: var(--texto-secundario); text-align: center;
      margin-bottom: 10px; padding: 10px; background: var(--fondo-pagina);
      border-radius: 8px; flex-shrink: 0;
    }
    .mapa-iframe {
      width: 100%;
      flex: none;
      height: 500px !important;
      min-height: 500px;
      max-height: 500px;
      border-radius: 12px;
      border: 2px solid var(--borde-item);
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .botones-mapa-linea {
      display: flex; gap: 8px; width: 100%;
      margin-top: auto;
      padding-top: 6px;
      flex-shrink: 0;
    }
    .btn-mapa {
      flex: 1; padding: 12px 6px; border-radius: 50px; border: none;
      font-weight: bold; font-size: 13px; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 4px; color: #fff;
      white-space: nowrap;
    }
    .btn-ver-mapa { background: #0066ff; flex: 1.2; }
    .btn-regresar-mapa {
      background: var(--rojo);
      flex: 0.8;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      :root { --tamano-logo: 70px; }
      .encabezado-tienda { padding: 3px 8px; min-height: 48px; }
      .titulo-principal { font-size: 15px; }
      .titulo-secundario { font-size: 10px; }
      .buscador { width: 50%; font-size: 12px; padding: 4px 8px; margin: 6px auto 5px; }
      .grid-productos { gap: 8px; }
      .item-foto { height: 140px; }
      .contenedor-foto { height: 30vh; min-height: 160px; }
      .btn, .btn-mapa { font-size: 11px; padding: 10px 3px; gap: 2px; }
      .btn-regresar-mapa { font-size: 11px; }
      .miniatura { width: 50px; height: 50px; }
      .detalle-precio { font-size: 22px; }
      .detalle-descripcion { font-size: 13px; max-height: 60px; }
      .mapa-iframe { height: 420px !important; min-height: 420px; }
    }

    @media (min-width: 600px) {
      .grid-productos { grid-template-columns: repeat(3, 1fr); gap: 15px; }
      .item-foto { height: 180px; }
      .mapa-iframe { height: 500px !important; }
    }
  </style>
</head>
<body>

<div id="pantallaLista">
  <!-- ✅ BARRA DE TÍTULO — CÍRCULOS ARRIBA ALINEADOS -->
  <div class="encabezado-tienda">
    <div class="circulo-rotativo">
      <img id="imagenCirculo" src="" alt="Producto">
    </div>

    <div class="titulo-tienda">
      <div class="titulo-principal">GATO IMPORT</div>
      <div class="titulo-secundario">CATÁLOGO DE PRODUCTOS</div>
    </div>

    <div class="logo-principal">
      <img src="https://i.postimg.cc/pVYRXx7T/log.jpg" alt="Logo Tienda">
    </div>
  </div>

  <!-- ✅ BUSCADOR Y PRODUCTOS — JUSTO DESPUÉS DE LA BARRA, SIN ESPACIO EXTRA -->
  <input type="text" id="buscador" class="buscador" placeholder="🔍 Buscar...">
  <div class="contador-general" id="contadorGeneral">Productos: 0</div>
  <div class="contenedor-lista">
    <div id="listaProductos" class="grid-productos">
      <div class="cargando">⏳ Cargando productos...</div>
    </div>
  </div>
</div>

<div id="pantallaDetalle">
  <div class="detalle-card">
    <div class="contenedor-foto">
      <button class="btn-flecha izquierda" onclick="fotoAnterior()">‹</button>
      <img id="fotoGrande" class="foto-principal" src="" alt="">
      <button class="btn-flecha derecha" onclick="fotoSiguiente()">›</button>
    </div>

    <div id="galeriaMiniaturas" class="galeria-miniaturas"></div>

    <div id="detallePrecio" class="detalle-precio"></div>
    <p id="detalleDescripcion" class="detalle-descripcion"></p>

    <div class="contenedor-botones">
      <button class="btn btn-regresar" onclick="regresarLista()"><span>←</span> Regresar</button>
      <a id="btnWhatsApp" class="btn btn-whatsapp" href="" target="_blank" rel="noopener noreferrer">
        <img src="https://i.postimg.cc/63HQcgF6/pngegg.png" alt="WhatsApp" class="logo-whatsapp">
        WhatsApp
      </a>
      <button class="btn btn-ubicacion" onclick="abrirPantallaMapa()"><span>📍</span> Ubícanos</button>
    </div>
  </div>
</div>

<div id="pantallaMapa">
  <div class="mapa-card">
    <h2 class="mapa-titulo">📍 Gato Import</h2>
    <p class="mapa-direccion">Tomas Moscoso 994 — El Porvenir, Trujillo, La Libertad, Perú</p>

    <iframe
      class="mapa-iframe"
      loading="lazy"
      src="https://www.google.com/maps?q=-8.078923,-79.004814&hl=es&z=16&output=embed">
    </iframe>

    <div class="botones-mapa-linea">
      <a class="btn-mapa btn-ver-mapa"
         href="https://www.google.com/maps/search/?api=1&query=-8.078923,-79.004814"
         target="_blank"
         rel="noopener noreferrer">
        🗺️ Google Maps
      </a>
      <button class="btn-mapa btn-regresar-mapa" onclick="regresarDesdeMapa()">
        ← Regresar
      </button>
    </div>
  </div>
</div>

<script>
const URL_CSV = "./productos.csv";

let productos = [];
let productosFiltrados = [];
let productoActual = null;
let indiceFotoActual = 0;
let indiceCirculo = 0;
let todasLasFotosCirculo = [];
let intervaloCirculo = null;
let intervaloCarrusel = null;
let pantallaAnterior = 'lista';

function iniciarCambioCirculo() {
  detenerCambioCirculo();
  if (!productos || productos.length === 0) return;
  
  todasLasFotosCirculo = [];
  productos.forEach(prod => {
    if (prod.fotos && prod.fotos.length > 0) {
      prod.fotos.forEach(foto => todasLasFotosCirculo.push(foto));
    }
  });
  
  if (todasLasFotosCirculo.length === 0) return;
  document.getElementById('imagenCirculo').src = todasLasFotosCirculo[0];
  
  intervaloCirculo = setInterval(() => {
    indiceCirculo++;
    if (indiceCirculo >= todasLasFotosCirculo.length) indiceCirculo = 0;
    document.getElementById('imagenCirculo').src = todasLasFotosCirculo[indiceCirculo];
  }, 2000);
}

function detenerCambioCirculo() {
  if (intervaloCirculo) {
    clearInterval(intervaloCirculo);
    intervaloCirculo = null;
  }
}

async function cargarCSVDesdeGitHub() {
  const lista = document.getElementById('listaProductos');
  try {
    const respuesta = await fetch(URL_CSV);
    if (!respuesta.ok) throw new Error(`Error ${respuesta.status}`);
    const textoCSV = await respuesta.text();
    if (!textoCSV || textoCSV.trim().length === 0) throw new Error("Archivo vacío");
    
    productos = parsearCSV(textoCSV);
    productosFiltrados = [...productos];
    mostrarLista();
    configurarBuscador();
    iniciarCambioCirculo();
    
  } catch (error) {
    lista.innerHTML = `
      <div class="error-csv">
        ⚠️ No se pudieron cargar los productos<br>
        <strong>${error.message}</strong><br>
        <div class="info-url">URL: ${URL_CSV}</div>
      </div>
    `;
  }
}

function parsearCSV(texto) {
  const lineas = texto.trim().split('\n');
  if (lineas.length < 2) return [];
  const encabezados = lineas[0].split(',').map(e => e.trim().toLowerCase());
  const lista = [];
  for (let i = 1; i < lineas.length; i++) {
    const valores = lineas[i].split(',').map(v => v.trim());
    if (valores.length < 2) continue;
    const prod = {};
    encabezados.forEach((enc, idx) => prod[enc] = valores[idx] || '');
    prod.fotos = [];
    let colFoto = 1;
    while (prod[`foto${colFoto}`] && prod[`foto${colFoto}`] !== '') {
      prod.fotos.push(prod[`foto${colFoto}`]);
      colFoto++;
    }
    lista.push(prod);
  }
  return lista;
}

function mostrarLista() {
  const lista = document.getElementById('listaProductos');
  lista.innerHTML = '';
  if (productosFiltrados.length === 0) {
    lista.innerHTML = '<div class="cargando">No se encontraron productos</div>';
    document.getElementById('contadorGeneral').textContent = 'Productos: 0';
    return;
  }
  productosFiltrados.forEach((prod) => {
    const div = document.createElement('div');
    div.className = 'item-producto';
    div.innerHTML = `
      <img src="${prod.fotos[0] || ''}" class="item-foto" alt="${prod.nombre}" loading="lazy">
      <div class="item-info">
        <div class="item-codigo">${prod.nombre || 'SIN-COD'}</div>
        <div class="item-precio">${prod.precio || ''}</div>
      </div>
    `;
    div.onclick = () => { seleccionarUnProducto(prod); abrirDetalle(prod); };
    lista.appendChild(div);
  });
  document.getElementById('contadorGeneral').textContent = `Productos: ${productosFiltrados.length}`;
}

function seleccionarUnProducto(prod) { productoActual = prod; }

function iniciarCarrusel() {
  detenerCarrusel();
  indiceFotoActual = 0;
  if (!productoActual || productoActual.fotos.length <= 1) return;
  intervaloCarrusel = setInterval(() => {
    indiceFotoActual++;
    if (indiceFotoActual >= productoActual.fotos.length) indiceFotoActual = 0;
    cambiarFotoPrincipal(productoActual.fotos[indiceFotoActual], indiceFotoActual);
  }, 4000);
}

function detenerCarrusel() { if (intervaloCarrusel) { clearInterval(intervaloCarrusel); intervaloCarrusel = null; } }

function fotoAnterior() {
  if (!productoActual || productoActual.fotos.length === 0) return;
  detenerCarrusel();
  indiceFotoActual--;
  if (indiceFotoActual < 0) indiceFotoActual = productoActual.fotos.length - 1;
  cambiarFotoPrincipal(productoActual.fotos[indiceFotoActual], indiceFotoActual);
}

function fotoSiguiente() {
  if (!productoActual || productoActual.fotos.length === 0) return;
  detenerCarrusel();
  indiceFotoActual++;
  if (indiceFotoActual >= productoActual.fotos.length) indiceFotoActual = 0;
  cambiarFotoPrincipal(productoActual.fotos[indiceFotoActual], indiceFotoActual);
}

function cambiarFotoPrincipal(foto, indiceActiva) {
  if (!productoActual) return;
  document.getElementById('fotoGrande').src = foto;
  indiceFotoActual = indiceActiva;
  document.querySelectorAll('.miniatura').forEach((m, i) => {
    i === indiceActiva ? m.classList.add('activa') : m.classList.remove('activa');
  });
}

function abrirDetalle(prod) {
  productoActual = prod;
  indiceFotoActual = 0;
  pantallaAnterior = 'lista';
  document.getElementById('pantallaLista').style.display = 'none';
  document.getElementById('pantallaDetalle').style.display = 'flex';
  document.getElementById('pantallaMapa').style.display = 'none';

  document.getElementById('detallePrecio').textContent = prod.precio || '';
  document.getElementById('detalleDescripcion').textContent = prod.descripcion || '';
  document.getElementById('fotoGrande').src = prod.fotos[0] || '';

  const galeria = document.getElementById('galeriaMiniaturas');
  galeria.innerHTML = '';
  prod.fotos.forEach((foto, index) => {
    const img = document.createElement('img');
    img.src = foto;
    img.className = `miniatura ${index === 0 ? 'activa' : ''}`;
    img.onclick = () => { detenerCarrusel(); cambiarFotoPrincipal(foto, index); };
    galeria.appendChild(img);
  });

  const tel = prod.telefono || '51925033823';
  const mensaje = encodeURIComponent(
    `¡Hola! Me interesa este producto:\n\n` +
    `📦 Código: ${prod.nombre}\n` +
    `💰 Precio: ${prod.precio}\n` +
    `📝 Descripción: ${prod.descripcion}\n\n` +
    `¿Está disponible?`
  );
  document.getElementById('btnWhatsApp').href = `https://wa.me/${tel}?text=${mensaje}`;

  iniciarCarrusel();
  window.scrollTo(0, 0);
}

function regresarLista() {
  detenerCarrusel();
  document.getElementById('pantallaDetalle').style.display = 'none';
  document.getElementById('pantallaMapa').style.display = 'none';
  document.getElementById('pantallaLista').style.display = 'block';
  pantallaAnterior = 'lista';
  window.scrollTo(0, 0);
}

function abrirPantallaMapa() {
  pantallaAnterior = 'detalle';
  detenerCarrusel();
  document.getElementById('pantallaLista').style.display = 'none';
  document.getElementById('pantallaDetalle').style.display = 'none';
  document.getElementById('pantallaMapa').style.display = 'flex';
  window.scrollTo(0, 0);
}

function regresarDesdeMapa() {
  if (pantallaAnterior === 'detalle') {
    document.getElementById('pantallaMapa').style.display = 'none';
    document.getElementById('pantallaDetalle').style.display = 'flex';
  } else {
    document.getElementById('pantallaMapa').style.display = 'none';
    document.getElementById('pantallaLista').style.display = 'block';
  }
  window.scrollTo(0, 0);
}

function configurarBuscador() {
  document.getElementById('buscador').addEventListener('input', (e) => {
    const texto = e.target.value.toUpperCase().trim();
    if (!texto) {
      productosFiltrados = [...productos];
    } else {
      productosFiltrados = productos.filter(prod =>
        (prod.nombre && prod.nombre.toUpperCase().includes(texto)) ||
        (prod.precio && prod.precio.includes(texto))
      );
    }
    mostrarLista();
  });
}

document.addEventListener('DOMContentLoaded', cargarCSVDesdeGitHub);
</script>
